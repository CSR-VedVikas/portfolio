<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1600px;
        height: 900px;
        background: #141210;
        color: #f4f2ed;
        font-family: "JetBrains Mono", monospace;
        box-sizing: border-box;
        padding: 48px 64px;
      }
      .title {
        font-size: 22px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #c8411e;
      }
      .sub {
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #98938a;
        margin-top: 8px;
      }
      text {
        font-family: "JetBrains Mono", monospace;
      }
      .box-label {
        font-size: 19px;
        font-weight: 500;
        fill: #f4f2ed;
        letter-spacing: 0.04em;
      }
      .box-detail {
        font-size: 14px;
        fill: #98938a;
      }
      .arrow-label {
        font-size: 14px;
        fill: #e85a38;
        letter-spacing: 0.04em;
      }
      .net-label {
        font-size: 14px;
        fill: #98938a;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div class="title">ForgeFit — deployment topology</div>
    <div class="sub">One docker compose command starts the whole stack</div>
    <svg width="1472" height="740" viewBox="0 0 1472 740" style="margin-top: 24px">
      <!-- Phone -->
      <rect x="20" y="240" width="310" height="140" fill="none" stroke="#f4f2ed" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="48" y="298" class="box-label">PHONE — PWA</text>
      <text x="48" y="330" class="box-detail">React 19 · Vite · installable</text>
      <text x="48" y="352" class="box-detail">service worker, iOS standalone</text>

      <!-- Phone -> nginx -->
      <line x1="330" y1="310" x2="470" y2="310" stroke="#c8411e" stroke-width="2" />
      <polygon points="470,304 482,310 470,316" fill="#c8411e" />
      <text x="340" y="292" class="arrow-label">HTTPS :443</text>
      <text x="340" y="340" class="arrow-label">ONLY PUBLIC PORT</text>

      <!-- nginx -->
      <rect x="486" y="240" width="310" height="140" fill="none" stroke="#c8411e" stroke-width="2" />
      <text x="514" y="290" class="box-label">NGINX</text>
      <text x="514" y="322" class="box-detail">TLS 1.2/1.3 · HSTS · CSP</text>
      <text x="514" y="344" class="box-detail">security headers · /api proxy</text>

      <!-- nginx -> private network -->
      <line x1="641" y1="380" x2="641" y2="450" stroke="#c8411e" stroke-width="2" />
      <polygon points="635,450 641,462 647,450" fill="#c8411e" />
      <text x="660" y="432" class="arrow-label">forwards API calls</text>

      <!-- Private network -->
      <rect x="320" y="466" width="780" height="230" fill="none" stroke="#98938a" stroke-width="1.5" stroke-dasharray="8 6" />
      <text x="340" y="500" class="net-label">PRIVATE DOCKER NETWORK — NO EXPOSED PORTS</text>

      <!-- FastAPI -->
      <rect x="356" y="522" width="300" height="140" fill="none" stroke="#f4f2ed" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="384" y="570" class="box-label">FASTAPI</text>
      <text x="384" y="602" class="box-detail">Python 3.12 · SQLAlchemy · PyJWT</text>
      <text x="384" y="624" class="box-detail">Alembic · bcrypt · unprivileged</text>

      <!-- FastAPI -> PostgreSQL -->
      <line x1="656" y1="592" x2="746" y2="592" stroke="#c8411e" stroke-width="2" />
      <polygon points="746,586 758,592 746,598" fill="#c8411e" />

      <!-- PostgreSQL -->
      <rect x="762" y="522" width="300" height="140" fill="none" stroke="#f4f2ed" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="790" y="574" class="box-label">POSTGRESQL 16</text>
      <text x="790" y="606" class="box-detail">17 tables · 4 migrations</text>
      <text x="790" y="628" class="box-detail">nightly compressed backups</text>

      <!-- FastAPI -> external APIs -->
      <line x1="796" y1="310" x2="796" y2="240" stroke="none" />
      <path d="M 656 560 C 900 540 1000 420 1030 330" fill="none" stroke="#c8411e" stroke-width="2" stroke-dasharray="none" />
      <polygon points="1024,338 1034,326 1038,340" fill="#c8411e" />
      <text x="1064" y="446" class="arrow-label">THE ONLY EGRESS —</text>
      <text x="1064" y="468" class="arrow-label">timeout + fallback on every call</text>

      <!-- External APIs -->
      <rect x="1034" y="180" width="420" height="140" fill="none" stroke="#f4f2ed" stroke-opacity="0.35" stroke-width="1.5" />
      <text x="1062" y="228" class="box-label">EXTERNAL APIS</text>
      <text x="1062" y="260" class="box-detail">OpenAI gpt-4o-mini · USDA FoodData Central</text>
      <text x="1062" y="282" class="box-detail">Open Food Facts · cache 24 h</text>

      <!-- footer note -->
      <text x="20" y="720" class="net-label">SECRETS NEVER IN GIT OR IMAGES · API RUNS UNPRIVILEGED · RESTORE REHEARSED ROW FOR ROW</text>
    </svg>
  </body>
</html>
