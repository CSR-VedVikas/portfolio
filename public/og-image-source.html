<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #141210;
        color: #f4f2ed;
        font-family: "Inter Tight", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 60px 72px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        justify-content: space-between;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #98938a;
      }
      .name {
        font-family: "Instrument Serif", serif;
        font-size: 116px;
        line-height: 1;
        margin: 0;
        color: #f4f2ed;
      }
      .rule {
        height: 5px;
        background: #c8411e;
        width: 132px;
        margin: 30px 0 26px;
      }
      .sub {
        font-size: 26px;
        color: #f4f2ed;
        max-width: 760px;
        line-height: 1.45;
        margin: 0;
      }
      .dot {
        color: #c8411e;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="mono">Portfolio</span>
      <span class="mono">PES University · Bengaluru</span>
    </div>
    <div>
      <h1 class="name">C S R VedVikas</h1>
      <div class="rule"></div>
      <p class="sub">Full-stack web applications, applied machine learning and security, hardware verification and antenna design.</p>
    </div>
    <div class="row">
      <span class="mono">github.com/CSR-VedVikas</span>
      <span class="mono">Batch 2023–2027</span>
    </div>
  </body>
</html>
